<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCI Model Analysis Gallery</title>
    <style>
        :root {
            --primary: #2C3E50;
            --secondary: #34495E;
            --accent: #3498DB;
            --bg-color: #F5F7FA;
            --sidebar-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #7F8C8D;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            background-color: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .subject-group {
            margin-bottom: 5px;
        }

        .subject-title {
            padding: 10px 20px;
            font-weight: 600;
            color: var(--secondary);
            background-color: #ECF0F1;
            font-size: 0.9em;
            display: flex;
            justify-content: space-between;
        }

        .session-btn {
            width: 100%;
            text-align: left;
            padding: 12px 30px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.95em;
            color: var(--text-main);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .session-btn:hover {
            background-color: #E8F4F8;
            color: var(--accent);
        }

        .session-btn.active {
            background-color: #D6EAF8;
            color: var(--accent);
            font-weight: bold;
            border-right: 4px solid var(--accent);
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            background-color: white;
            padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }

        .nav-controls button {
            padding: 8px 16px;
            margin-left: 10px;
            border: 1px solid var(--accent);
            background-color: white;
            color: var(--accent);
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .nav-controls button:hover {
            background-color: var(--accent);
            color: white;
        }

        .gallery-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Tab Buttons Styles */
        .tab-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: 1px solid #ddd;
            background-color: white;
            color: var(--text-muted);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background-color: #f0f0f0;
            color: var(--primary);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(52, 152, 219, 0.3);
        }

        .tab-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Image Display Area */
        .image-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 95%; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-wrapper {
            padding: 20px;
            display: flex;
            justify-content: center; 
            /* 移除 align-items: center，讓長圖可以從頂部開始顯示 */
            align-items: flex-start;
            width: 100%;
            background-color: white;
            box-sizing: border-box;
            
            /* 【關鍵修改】設定最大高度，超出時顯示垂直捲軸 */
            max-height: 80vh; 
            overflow-y: auto; 
        }

        .image-wrapper img {
            /* 【修改】設定寬度為 100%，高度自動等比縮放 */
            width: 100%; 
            max-width: 1200px; /* 避免在超大螢幕上圖片被放得太大 */
            height: auto;
            border-radius: 4px;
            display: block;
            margin: 0 auto;
        }

        .error-state {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            width: 100%;
        }

        /* Keyboard hint */
        .keyboard-hint {
            font-size: 0.8em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }
        
        /* 捲軸美化 (可選) */
        .image-wrapper::-webkit-scrollbar {
            width: 10px;
        }
        .image-wrapper::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .image-wrapper::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        .image-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
            <h2>BCI Analyzer</h2>
        </div>
        <div class="sidebar-content" id="sidebar-content">
            </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div>
                <h2 style="margin: 0; color: var(--primary);" id="current-title">Select a Session</h2>
                <div class="keyboard-hint">
                    <svg style="width:16px;height:16px;fill:#7F8C8D;" viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-2 0H4v-2h2v2zm0-3H4V8h2v2zm9 7H9v-2h6v2zm2-4h-2v-2h2v2zm0-3h-2V8h2v2zm2 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
                    Use ← Left / Right → arrow keys to navigate quickly
                </div>
            </div>
            <div class="nav-controls">
                <button onclick="navigate(-1)">&#8592; Prev</button>
                <button onclick="navigate(1)">Next &#8594;</button>
            </div>
        </div>
        
        <div class="gallery-container">
            <div class="tab-container" id="tab-container">
                </div>

            <div class="image-card">
                <div class="image-wrapper" id="image-display-area">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // Data derived from Python script
        const rawData = {
            35: {'s1': 'B', 's2': 'A'},
            37: {'s1': 'A', 's2': 'B'},
            38: {'s1': 'B', 's2': 'A'},
            40: {'s1': 'B', 's2': 'A'},
            41: {'s1': 'B', 's2': 'A'},
            42: {'s1': 'A', 's2': 'B'},
            43: {'s1': 'A', 's2': 'B'},
            44: {'s1': 'B', 's2': 'A'},
            45: {'s1': 'B', 's2': 'A'},
            47: {'s1': 'B', 's2': 'A'},
            48: {'s1': 'B', 's2': 'A'},
            50: {'s1': 'A', 's2': 'B'},
            51: {'s1': 'B', 's2': 'A'},
            52: {'s1': 'B', 's2': 'A'},
            54: {'s1': 'B', 's2': 'A'},
            55: {'s1': 'A', 's2': 'B'},
            57: {'s1': 'B', 's2': 'A'},
            58: {'s1': 'A', 's2': 'B'},
            63: {'s1': 'A', 's2': 'B'},
            64: {'s1': 'A', 's2': 'B'},
            65: {'s1': 'A', 's2': 'B'},
            68: {'s1': 'A', 's2': 'B'},
            69: {'s1': 'A', 's2': 'B'},
            70: {'s1': 'A', 's2': 'B'}
        };

        const subjectIds = Object.keys(rawData).sort((a, b) => parseInt(a) - parseInt(b));
        const idMap = {};
        subjectIds.forEach((id, index) => {
            idMap[id] = index + 1; 
        });

        const imageTypes = [
            { id: 'probs', title: 'Softmax Probabilities Trend', suffix: '_probs_trend.png', icon: 'M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z' },
            { id: 'logits', title: 'Logits Trend', suffix: '_logits_trend.png', icon: 'M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z' },
            { id: 'metrics', title: 'Metrics Trend Comprehensive', suffix: '_metrics_trend_comprehensive.png', icon: 'M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z' },
            { id: 'feature', title: 'PCA Feature Space', suffix: '_trajectory_feature_space.png', icon: 'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z' },
            { id: 'param', title: 'PCA Parameter Space', suffix: '_trajectory_parameter_space.png', icon: 'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z' }
        ];

        let navigationList = [];
        let currentIndex = -1;
        let currentTabId = imageTypes[0].id; 

        function initDashboard() {
            const sidebar = document.getElementById('sidebar-content');
            
            subjectIds.forEach(sub => {
                const group = document.createElement('div');
                group.className = 'subject-group';
                
                const displayNum = idMap[sub];
                group.innerHTML = `<div class="subject-title">Subject ${displayNum}</div>`;
                
                Object.keys(rawData[sub]).forEach(sess => {
                    let condRaw = rawData[sub][sess];
                    let condDisplay = condRaw === 'A' ? 'Static' : (condRaw === 'B' ? 'Adaptive' : condRaw);
                    
                    const index = navigationList.length;
                    
                    navigationList.push({ 
                        originalSub: sub, 
                        displayNum: displayNum,
                        sess: sess, 
                        cond: condDisplay 
                    });
                    
                    const btn = document.createElement('button');
                    btn.className = 'session-btn';
                    btn.id = `navbtn-${index}`;
                    btn.innerHTML = `
                        <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                        ${sess.toUpperCase()} (Cond: ${condDisplay})
                    `;
                    btn.onclick = () => loadSubject(index);
                    
                    group.appendChild(btn);
                });
                sidebar.appendChild(group);
            });

            const tabContainer = document.getElementById('tab-container');
            imageTypes.forEach(type => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.id = `tabbtn-${type.id}`;
                if (type.id === currentTabId) btn.classList.add('active');
                
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24"><path d="${type.icon}"/></svg>
                    ${type.title}
                `;
                btn.onclick = () => switchTab(type.id);
                tabContainer.appendChild(btn);
            });

            if (navigationList.length > 0) {
                loadSubject(0);
            }
        }

        function loadSubject(index) {
            if (index < 0 || index >= navigationList.length) return;
            
            if (currentIndex !== -1) {
                document.getElementById(`navbtn-${currentIndex}`).classList.remove('active');
            }
            currentIndex = index;
            const currentBtn = document.getElementById(`navbtn-${currentIndex}`);
            currentBtn.classList.add('active');
            currentBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            const data = navigationList[currentIndex];
            document.getElementById('current-title').innerText = `Subject ${data.displayNum} - ${data.sess.toUpperCase()} (Condition: ${data.cond})`;
            
            renderImage();
        }

        function switchTab(tabId) {
            document.getElementById(`tabbtn-${currentTabId}`).classList.remove('active');
            currentTabId = tabId;
            document.getElementById(`tabbtn-${currentTabId}`).classList.add('active');
            
            renderImage();
        }

        function renderImage() {
            if (currentIndex === -1) return;
            
            const data = navigationList[currentIndex];
            const typeInfo = imageTypes.find(t => t.id === currentTabId);
            
            const imgPath = `./model_analyze/${data.originalSub}/${data.sess}${typeInfo.suffix}`;
            const displayArea = document.getElementById('image-display-area');
            
            displayArea.innerHTML = `
                <img src="${imgPath}" alt="${typeInfo.title}" onerror="this.parentElement.innerHTML='<div class=\\'error-state\\'>Image not found or not generated yet:<br><small>${imgPath}</small></div>'">
            `;
            
            // 每次切換圖片時，將卷軸拉回最上方
            displayArea.scrollTop = 0;
        }

        function navigate(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < navigationList.length) {
                loadSubject(newIndex);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                navigate(1);
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                navigate(-1);
            }
        });

        window.onload = initDashboard;
    </script>
</body>
</html>
